<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方块小天地</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">我的第一个编程世界 · 01</p><h1>方块小天地 🌱</h1></div>
      <span class="badge">自由建造，快乐探索</span>
    </header>
    <section class="toolbar" aria-label="建造工具">
      <div>
        <button id="place" class="selected" aria-pressed="true">＋ 放置方块</button>
        <button id="remove" aria-pressed="false">－ 删除方块</button>
      </div>
      <button id="reset">↻ 重新开始</button>
    </section>
    <!-- canvas 是画布，JavaScript 会在上面画出世界。 -->
    <canvas id="game" width="960" height="576" tabindex="0" aria-label="方块世界。方向键移动，空格跳跃，鼠标点击建造。"></canvas>
    <p id="status" role="status">点击空格子放置方块，试着搭一座小楼梯吧！</p>
    <section class="guide" aria-label="游戏玩法">
      <div><span>01</span><h2>走一走</h2><p><kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 左右移动</p></div>
      <div><span>02</span><h2>跳一跳</h2><p><kbd>空格</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> 跳跃</p></div>
      <div><span>03</span><h2>造一造</h2><p>左键使用工具 · 右键快速删除</p></div>
    </section>
    <footer>小提示：先点一下游戏画面，再用键盘探索。刷新页面会重新开始。</footer>
  </main>
</body>
</html>
